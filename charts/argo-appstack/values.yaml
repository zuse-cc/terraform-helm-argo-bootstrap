stack:
  name: appstack  # Used as AppProject name and Application name prefix — set via --name in bootstrap.sh
autosync:
  enabled: true
cluster:
  name: k3d-lab-mycluster
  domain: ""
source:
  repoURL: https://github.com/your-org/your-repo.git
  targetRevision: main
helm:
  repoURL: ghcr.io/your-org/helm
extraSourceRepos: []
secrets:
  backend:
    kubernetes:
      namespace: ""  # defaults to {{ stack.name }}-secrets
    infisical:
      endpoint: https://eu.infisical.com
      environment: dev
      projectSlug: ""
      secretsPath: ""
      credentialsSecret: ""  # defaults to {{ stack.name }}-credentials
